<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台灣血脂 CDS · SMART on FHIR</title>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="brand-mark">脂</div>

          <div class="brand-name">台灣血脂 CDS</div>
          <div class="brand-sub">SMART on FHIR</div>
        </div>
      </div>
      <a class="nav-item on" href="#/overview">血脂評估 <span class="tag">CDS</span></a>
